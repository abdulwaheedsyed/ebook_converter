<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Leafbind">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- an open book: two pages meeting at the binding -->
  <path d="M12.5 19.5c6.8-2.9 13-2.3 19.5 2.2v24.6c-6.5-4.4-12.7-5-19.5-2.2z" fill="#FFFFFF"/>
  <path d="M51.5 19.5c-6.8-2.9-13-2.3-19.5 2.2v24.6c6.5-4.4 12.7-5 19.5-2.2z" fill="#E0E7FF"/>
  <!-- stitches along the binding -->
  <path d="M32 24.5v3.2M32 31.2v3.2M32 37.9v3.2" stroke="#4338CA" stroke-width="1.6" stroke-linecap="round"/>
  <!-- a leaf on the right-hand page -->
  <path d="M38.2 38.6c-1.6-6.4 2.2-10.9 9.3-11.4 1 6.9-2.9 11.5-9.3 11.4z" fill="#4F46E5"/>
  <path d="M36.4 41.2l2.6-3.4c2.2-2.9 4.2-5 6.6-7" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M39.4 37.5c1.9-2.4 3.6-4.2 5.8-5.9" stroke="#E0E7FF" stroke-width="1.1" stroke-linecap="round" fill="none"/>
</svg>
