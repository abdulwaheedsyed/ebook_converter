name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # The full suite, including end-to-end conversions through the embedded
  # PDF engine, on each operating system and architecture that is released.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux/amd64 }
          - { os: ubuntu-24.04-arm, platform: linux/arm64 }
          - { os: macos-latest, platform: darwin/arm64 }
          - { os: windows-latest, platform: windows/amd64 }
          - { os: windows-11-arm, platform: windows/arm64 }
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./...
        env:
          CGO_ENABLED: "0"
      # Intel macOS: the Apple silicon runner runs amd64 binaries under
      # Rosetta, which exercises the darwin/amd64 build without an Intel host.
      - name: go test (darwin/amd64 under Rosetta)
        if: runner.os == 'macOS'
        run: go test ./...
        env:
          CGO_ENABLED: "0"
          GOARCH: amd64

  # The built-in validation is tested against results recorded from
  # epubcheck. This checks the recording against a live epubcheck, so it
  # cannot drift from what epubcheck really reports.
  epubcheck:
    name: recorded results match epubcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install epubcheck 5.4.0
        run: |
          curl -sSfL -o "$RUNNER_TEMP/epubcheck.zip" https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec java -jar "%s/epubcheck-5.4.0/epubcheck.jar" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/bin/epubcheck"
          chmod +x "$RUNNER_TEMP/bin/epubcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: epubcheck --version
      - run: go test -run TestEpubcheckGolden -v ./internal/check
        env:
          EPUBCHECK_VERIFY: "1"

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: leafbind-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          retention-days: 14
